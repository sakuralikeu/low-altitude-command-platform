name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: 静态验证（typecheck · test · build · audit · compose）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild esbuild @parcel/watcher
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker compose config --quiet

  e2e:
    name: 多分辨率 E2E（Playwright 矩阵 + axe）
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts && npm rebuild esbuild @parcel/watcher
      - run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            e2e/results/report/
            e2e/results/screenshots/
            e2e/results/output/
          retention-days: 14
